name: Attach release asset

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public HTTPS URL of the asset
        required: true
        type: string
      sha256:
        description: Expected SHA-256
        required: true
        type: string
      release_id:
        description: GitHub release ID
        required: true
        type: string
      asset_name:
        description: Asset filename
        required: true
        type: string

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: curl -fL --retry 5 --retry-delay 5 --max-time 900 -o asset.bin "${{ inputs.url }}"
      - name: Verify
        run: |
          echo "${{ inputs.sha256 }}  asset.bin" | sha256sum -c -
          ls -lh asset.bin
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          curl -fL --retry 3 --retry-delay 5 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/zip" \
            --data-binary @asset.bin \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}"
