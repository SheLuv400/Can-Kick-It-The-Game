name: Attach Windows build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upload-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download staged Windows build
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 -o CanIKickIt-win32-x64.zip "https://litter.catbox.moe/16xwg2.zip"
      - name: Verify SHA-256
        run: |
          echo "b8dbe46fcaf65b503f133a45294b490dd7a83d860ec5bae83456622429d7e2f1  CanIKickIt-win32-x64.zip" | sha256sum -c -
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.2.0 CanIKickIt-win32-x64.zip --clobber --repo SheLuv400/Can-Kick-It-The-Game
