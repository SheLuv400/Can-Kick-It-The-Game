name: Attach launcher asset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Download launcher
        run: curl -L --fail --retry 3 --retry-delay 2 -o CanIKickItLauncher-1.0.0-win32-x64.zip "https://files.catbox.moe/0mj5xx.zip"
      - name: Verify launcher
        run: |
          echo "7ac54c7a4a0dbae4eb866e980535bd511db77e63701a98ad5ecfab1297487ef9  CanIKickItLauncher-1.0.0-win32-x64.zip" | sha256sum -c -
          unzip -t CanIKickItLauncher-1.0.0-win32-x64.zip
          sha256sum CanIKickItLauncher-1.0.0-win32-x64.zip > CanIKickItLauncher-1.0.0-win32-x64.zip.sha256
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload v1.4.0 CanIKickItLauncher-1.0.0-win32-x64.zip CanIKickItLauncher-1.0.0-win32-x64.zip.sha256 --clobber
