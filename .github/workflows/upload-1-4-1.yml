name: Upload 1.4.1 Windows assets

on:
  workflow_dispatch:
    inputs:
      asset_url:
        description: Temporary download URL for the 1.4.1 game ZIP
        required: true
        type: string
      sha256:
        description: Expected SHA-256 for the 1.4.1 game ZIP
        required: true
        type: string

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify the game archive
        env:
          ASSET_URL: ${{ inputs.asset_url }}
          EXPECTED_SHA: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 --output CanIKickIt-1.4.1-win32-x64.zip "$ASSET_URL"
          printf '%s  %s\n' "$EXPECTED_SHA" "CanIKickIt-1.4.1-win32-x64.zip" | sha256sum --check --strict
          printf '%s  %s\n' "$EXPECTED_SHA" "CanIKickIt-1.4.1-win32-x64.zip" > CanIKickIt-1.4.1-win32-x64.zip.sha256
      - name: Attach the game archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v1.4.1 CanIKickIt-1.4.1-win32-x64.zip CanIKickIt-1.4.1-win32-x64.zip.sha256 --clobber
      - name: Copy the existing launcher into the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p launcher
          gh release download v1.4.0 --pattern 'CanIKickItLauncher-1.0.0-win32-x64.zip*' --dir launcher
          gh release upload v1.4.1 launcher/CanIKickItLauncher-1.0.0-win32-x64.zip launcher/CanIKickItLauncher-1.0.0-win32-x64.zip.sha256 --clobber
